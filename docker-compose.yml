services:
  commodity-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: commodity-equity-analyzer:latest
    container_name: commodity-analyzer
    restart: unless-stopped

    ports:
      - "8501:8501"        # Change the left side to use a different host port

    volumes:
      # Persist watchlist.json across container restarts/upgrades
      - watchlist_data:/app/data_store

    environment:
      - WATCHLIST_DIR=/app/data_store
      # Optional: set TZ for correct signal timestamps
      - TZ=Asia/Shanghai

    # Resource limits (adjust for your NAS hardware)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  watchlist_data:
    driver: local
